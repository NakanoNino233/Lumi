name: Build Lumi unsigned IPA
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 or newer
        shell: bash
        run: |
          set -euo pipefail
          xcode_path="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -type d | sort -V | tail -n 1)"
          test -n "$xcode_path"
          sudo xcode-select -s "$xcode_path/Contents/Developer"
          xcodebuild -version
      - name: Build and package
        run: bash Distribution/build-unsigned.sh "$RUNNER_TEMP/lumi"
      - name: Upload install package
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-unsigned
          path: |
            ${{ runner.temp }}/lumi/Lumi-unsigned.ipa
            ${{ runner.temp }}/lumi/Lumi-unsigned.ipa.sha256
            ${{ runner.temp }}/lumi/ipa-validation.txt
          if-no-files-found: error
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-build-log
          path: ${{ runner.temp }}/lumi/build.log
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Lumi-unsigned
          path: package
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Lumi $TAG" --notes "Unsigned iOS build. Install and sign using AltStore Classic or SideStore."
          gh release upload "$TAG" package/Lumi-unsigned.ipa package/Lumi-unsigned.ipa.sha256 --clobber
