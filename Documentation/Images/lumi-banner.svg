<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc">
  <title id="title">Lumi — 让日常，多一点陪伴。</title>
  <desc id="desc">Native iOS and Android AI companions, local memories and everyday moments, on a warm cream and forest green background.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfaf3"/><stop offset="1" stop-color="#e8f0e7"/></linearGradient>
    <linearGradient id="forest" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#326b58"/><stop offset="1" stop-color="#1c483d"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="1438" height="438" rx="38" fill="url(#paper)" stroke="#dce7dc" stroke-width="2"/>
  <circle cx="1325" cy="45" r="180" fill="#d9e7d7" opacity=".5"/>
  <circle cx="1030" cy="440" r="210" fill="#e4ead7" opacity=".65"/>
  <path d="M104 66h26" stroke="#d4b35b" stroke-width="4" stroke-linecap="round"/>
  <text x="146" y="74" fill="#65806e" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="3">A LITTLE COMPANY, EVERY DAY</text>
  <text x="98" y="210" fill="#244e40" font-family="Trebuchet MS,Arial,sans-serif" font-size="126" font-weight="700" letter-spacing="-7">Lumi<tspan fill="#c9a747">.</tspan></text>
  <text x="104" y="283" fill="#2e5848" font-family="Microsoft YaHei,PingFang SC,Noto Sans CJK SC,sans-serif" font-size="43" font-weight="600">让日常，多一点陪伴。</text>
  <text x="106" y="328" fill="#6c8174" font-family="Arial,sans-serif" font-size="23">Your friends. Your memories. Your little world.</text>
  <rect x="105" y="365" width="94" height="31" rx="15.5" fill="#e3eadc"/>
  <text x="152" y="387" text-anchor="middle" fill="#38634f" font-family="Arial,sans-serif" font-size="16" font-weight="700">iOS 17+</text>
  <rect x="212" y="365" width="138" height="31" rx="15.5" fill="#e3eadc"/>
  <text x="281" y="387" text-anchor="middle" fill="#38634f" font-family="Arial,sans-serif" font-size="16" font-weight="700">Android 8.0+</text>
  <g transform="translate(815 89) rotate(-5 230 100)">
    <rect x="0" y="8" width="468" height="191" rx="29" fill="#183e32" opacity=".07"/>
    <rect width="468" height="191" rx="29" fill="url(#forest)"/>
    <path d="M50 187l-7 36 57-32" fill="#2e6252"/>
    <circle cx="39" cy="42" r="5" fill="#d9be73"/>
    <text x="57" y="49" fill="#e7ecd9" font-family="Arial,sans-serif" font-size="17" letter-spacing="2">HERE FOR YOUR EVERYDAY</text>
    <text x="33" y="109" fill="#fbfaf2" font-family="Trebuchet MS,Arial,sans-serif" font-size="48" font-weight="700">Say hello.</text>
    <text x="35" y="151" fill="#dbe8d6" font-family="Arial,sans-serif" font-size="21">A new story starts with you.</text>
    <path d="M406 65q4 27 28 31-24 4-28 31-4-27-28-31 24-4 28-31" fill="#e4c776"/>
  </g>
  <g transform="translate(869 278) rotate(4 205 48)">
    <rect x="0" y="5" width="420" height="104" rx="24" fill="#244c3b" opacity=".06"/>
    <rect width="420" height="104" rx="24" fill="#fffffa" stroke="#d5dfcd" stroke-width="2"/>
    <rect x="23" y="27" width="49" height="49" rx="17" fill="#eef2df"/>
    <path d="M48 37v30m-15-15h30" stroke="#77916a" stroke-width="3" stroke-linecap="round"/>
    <text x="92" y="46" fill="#2d5746" font-family="Trebuchet MS,Arial,sans-serif" font-size="25" font-weight="700">Keep a little memory.</text>
    <text x="92" y="75" fill="#7a8d7e" font-family="Arial,sans-serif" font-size="18">Some moments deserve to stay.</text>
  </g>
  <path d="M1340 256q3 16 18 19-15 3-18 19-3-16-18-19 15-3 18-19" fill="#cfb263"/>
  <circle cx="762" cy="347" r="5" fill="#b5c8a9"/>
  <circle cx="1344" cy="355" r="3" fill="#9eb996"/>
</svg>
