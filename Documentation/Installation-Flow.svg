<text x="62" y="155" font-size="23">1　保存 IPA</text><text x="62" y="198" font-size="18">下载 Release 或构建产物</text><text x="62" y="230" font-size="18">确认来自你信任的源码</text>
<text x="423" y="155" font-size="23">2　导入并签名</text><text x="423" y="198" font-size="18">AltStore Classic / SideStore</text><text x="423" y="230" font-size="18">按官方教程完成工具安装</text>
<text x="782" y="155" font-size="23">3　定期刷新</text><text x="782" y="198" font-size="18">到期前在原工具中续签</text><text x="782" y="230" font-size="18">续签前导出 Lumi 备份</text>
<text x="344" y="210" font-size="35">→</text><text x="704" y="210" font-size="35">→</text>
